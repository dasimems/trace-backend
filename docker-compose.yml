services:
  dev:
    image: postgres:16
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: trace-user
      POSTGRES_PASSWORD: trace-user
      POSTGRES_DB: trace
    networks:
      - trace
  redis:
    image: redis:7
    ports:
      - 6379:6379
    networks:
      - trace
networks:
  trace:
